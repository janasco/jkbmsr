[platformio]
default_envs = dev

; The official `espressif32` platform is PINNED to 7.0.1 deliberately. An
; unpinned `platform = espressif32` has been observed resolving to the
; pioarduino fork's Arduino-ESP32 core 3.x, because the C6 envs below install
; that fork under the same PlatformIO platform name ("espressif32") and the two
; share one ~/.platformio. Core 3.x removed APIs the shared code was written
; against (e.g. WiFiClientSecure::setReadTimeout), so the matrix broke. 7.0.1
; is the official release that pins framework-arduinoespressif32 ~3.20017
; (Arduino-ESP32 2.0.17), which is what the non-C6 targets expect. The C6 envs
; keep their own explicit fork URL pin below.

; ---------------------------------------------------------------------------
; env:dev — pure Arduino (prebuilt IDF). Fast iteration + unit-test host for
; CI. Remains the default until Phase 2 P2-6 flips the default to env:idf.
; ---------------------------------------------------------------------------
[env:dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
; Larger OTA app slots: NimBLE (JK-BMS BLE support) does not fit the stock
; 1.25MB slots. Same nvs/otadata/app0 offsets as the default table; devices on
; the old table need one USB reflash (OTA cannot rewrite the partition table).
board_build.partitions = partitions-4mb-ota.csv
; Embed the Mozilla root-CA bundle so WiFiClientSecure can verify the server
; certificate chain (see src/net/SecureClient.cpp). The linker symbol
; _binary_data_cert_x509_crt_bundle_bin_start is derived from this exact path.
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
; TLS certificate-chain verification can exceed Arduino's default 8KB loop
; task stack. Keep enough headroom for OTA and telemetry HTTPS calls.
;
; See include/HardwareProfile.h for what each of these means and its
; ifndef-guarded default. JKBMSR_TARGET_HARDWARE/JKBMSR_HARDWARE_PLATFORM/
; JKBMSR_BOARD_PROFILE are reported at device registration (see
; src/cloud/DeviceRegistrationClient.cpp) and the first two validated
; server-side against jkbmsr-api's gatewayHardwareTargets catalog. Every
; target in this file has a Bluetooth radio and the OTA subsystem: the BMS
; link is Bluetooth (BLE) only, so there is no per-target capability flag and
; no UART configuration.
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; "esp32-classic-4mb", not the older "esp32dev" — jkbmsr-api's
  ; gatewayHardwareTargets catalog keeps "esp32dev" registered only as a
  ; "legacy" entry so devices that checked in under the old string before
  ; this multi-target system existed keep validating; every current/future
  ; check-in from this env re-reports the "supported" string instead. Safe
  ; to change freely — device continuity is keyed on hardwareFingerprint()
  ; (see docs/hardware-identity-and-license-transfer.md), never on this
  ; descriptive field, and hardware-targets.json already documents this env
  ; as "esp32-classic-4mb" too.
  -DJKBMSR_TARGET_HARDWARE=\"esp32-classic-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32dev\"
  -DJKBMSR_MAX_GPIO_PIN=39
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0
; The Improv Wi-Fi Serial provisioning protocol is implemented in-tree under
; src/provisioning/ (no external library) to match this codebase's minimal-
; dependency style and to keep the framing logic unit-testable over a fake
; Stream. See docs/phase1-provisioning-spec.md.
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3

; ---------------------------------------------------------------------------
; env:idf — Arduino as an ESP-IDF component. Required before flash/NVS
; encryption and Secure Boot (Phase 2). Does not yet enable those features;
; see docs/phase2-encryption-spec.md (P2-0).
; ---------------------------------------------------------------------------
[env:idf]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions-secure.csv
; board_build.flash_size alone does not propagate into the compiled
; sdkconfig for Arduino-as-IDF-component builds -- see sdkconfig.defaults.4mb.
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb"
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DJKBMSR_ARDUINO_AS_IDF=1
  -DJKBMSR_TARGET_HARDWARE=\"esp32-classic-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32dev\"
  -DJKBMSR_MAX_GPIO_PIN=39
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0

; ---------------------------------------------------------------------------
; Additional ESP32-family targets. These share the gateway core but have
; independent chip-family binaries and pin profiles.
; ---------------------------------------------------------------------------
[env:esp32-c3-4mb]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions-4mb-ota.csv
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DJKBMSR_TARGET_HARDWARE=\"esp32-c3-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-c3-devkitm-1\"
  -DJKBMSR_MAX_GPIO_PIN=21
  -DJKBMSR_PROVISIONING_BUTTON_PIN=9

[env:esp32-s3-4mb]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions-4mb-ota.csv
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DJKBMSR_TARGET_HARDWARE=\"esp32-s3-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-s3-devkitc-1\"
  -DJKBMSR_MAX_GPIO_PIN=48
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0

; ---------------------------------------------------------------------------
; env:esp32-classic-8mb — same chip/pins/capabilities as env:dev
; (esp32-classic-4mb), for boards with >=8MB flash. The only real difference
; is partitions-8mb-ota.csv: app0/app1 grow from 1.875MB to ~3.82MB each
; (headroom for future features, not needed by the current firmware image),
; and spiffs grows from 128KB to 256KB. Matches jkbmsr-api's
; "esp32-classic-8mb" hardware target.
; ---------------------------------------------------------------------------
[env:esp32-classic-8mb]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = partitions-8mb-ota.csv
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DJKBMSR_TARGET_HARDWARE=\"esp32-classic-8mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32dev\"
  -DJKBMSR_MAX_GPIO_PIN=39
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3

; ---------------------------------------------------------------------------
; env:esp32-c6-4mb — ESP32-C6 (RISC-V, WiFi 6 + Bluetooth 5.3). The official
; PlatformIO espressif32 platform has no Arduino-framework board defs for
; this chip at all (only espidf) — this env pins the community pioarduino
; fork instead, which does. See README's "Also builds for env:esp32-c6-4mb"
; note for the shared-platform-name caching gotcha this creates locally
; (harmless in CI — see firmware.yml/ota-release.yml, both give this target
; its own isolated job/cache-key so it can never collide with the official-
; platform targets above). Uses a newer Arduino-ESP32 core (3.3.11 via this
; platform release) than the rest of the file, so NimBLE-Arduino is pinned
; separately too (2.x, not the 1.4.3 the older-core targets use) —
; h2zero/NimBLE-Arduino's C6 support needs the newer core.
;
; GPIO9 for the provisioning button is intentional despite being a strap:
; it's the reference BOOT button pin, momentarily user-pressed, not a
; continuously-driven external signal — same convention as C3's BOOT button.
; ---------------------------------------------------------------------------
[env:esp32-c6-4mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions-4mb-ota.csv
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DJKBMSR_TARGET_HARDWARE=\"esp32-c6-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-c6-devkitc-1\"
  -DJKBMSR_MAX_GPIO_PIN=23
  -DJKBMSR_PROVISIONING_BUTTON_PIN=9

; ---------------------------------------------------------------------------
; env:idf-c6 / idf-secure-c6 / idf-secureboot-c6 — same Phase 2 treatment,
; ESP32-C6 (RISC-V, no Secure Boot chip-revision gate, see
; sdkconfig.defaults.secureboot.c6). Belongs in CI's isolated build-c6 job,
; not the main build job — same pioarduino-platform-name-collision reason as
; env:esp32-c6-4mb above. LEAST PROVEN of the idf* envs in this file: the
; community platform fork's Arduino-as-IDF + Secure Boot v2 support for this
; specific chip has not been confirmed anywhere but CI. Verify a CI build
; passes before trusting this for real hardware bring-up.
; ---------------------------------------------------------------------------
[env:idf-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions-secure.csv
; board_build.flash_size alone does not propagate into the compiled
; sdkconfig for Arduino-as-IDF-component builds -- see sdkconfig.defaults.4mb.
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb"
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DJKBMSR_ARDUINO_AS_IDF=1
  -DJKBMSR_TARGET_HARDWARE=\"esp32-c6-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-c6-devkitc-1\"
  -DJKBMSR_MAX_GPIO_PIN=23
  -DJKBMSR_PROVISIONING_BUTTON_PIN=9

[env:idf-secure-c6]
extends = env:idf-c6
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure"

[env:idf-secureboot-c6]
extends = env:idf-c6
board_build.partitions = partitions-secureboot.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure;sdkconfig.defaults.secureboot.c6"

; ---------------------------------------------------------------------------
; env:idf-secure — same as env:idf plus flash encryption (DEVELOPMENT) and
; NVS encryption. First boot after flashing encrypts in place and resets.
; UART download remains available (not Release mode). See
; docs/phase2-encryption-spec.md (P2-2, P2-3).
; ---------------------------------------------------------------------------
[env:idf-secure]
extends = env:idf
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure"

; ---------------------------------------------------------------------------
; env:idf-secureboot — idf-secure + Secure Boot v2 signed images.
; Requires ESP32 ECO3+ and keys/secure_boot_signing_key.pem (gitignored).
; Generate: scripts/generate-secure-boot-dev-key.sh
; See docs/phase2-encryption-spec.md (P2-4).
; ---------------------------------------------------------------------------
[env:idf-secureboot]
extends = env:idf
board_build.partitions = partitions-secureboot.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure;sdkconfig.defaults.secureboot"

; ---------------------------------------------------------------------------
; env:idf-s3 — Arduino as an ESP-IDF component, ESP32-S3. Same role as
; env:idf but for the S3 target: required before flash/NVS encryption and
; Secure Boot on this chip family. Does not yet enable those features; see
; docs/phase2-encryption-spec.md and docs/phase3-production-hardening.md §0.
; ---------------------------------------------------------------------------
[env:idf-s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = partitions-secure.csv
; board_build.flash_size alone does not propagate into the compiled
; sdkconfig for Arduino-as-IDF-component builds -- see sdkconfig.defaults.4mb.
; Confirmed on real ESP32-S3 hardware (2026-08-21): without this, the
; compiled bootloader silently assumed IDF's raw 2MB default instead, which
; esptool flagged at upload time and which corrupted flash-encrypted boots.
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb"
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DJKBMSR_ARDUINO_AS_IDF=1
  -DJKBMSR_TARGET_HARDWARE=\"esp32-s3-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-s3-devkitc-1\"
  -DJKBMSR_MAX_GPIO_PIN=48
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0

; ---------------------------------------------------------------------------
; env:idf-secure-s3 — env:idf-s3 plus flash encryption (DEVELOPMENT) and NVS
; encryption. Reuses sdkconfig.defaults.secure as-is — those flags are chip-
; family agnostic. See docs/phase2-encryption-spec.md (P2-2, P2-3).
; ---------------------------------------------------------------------------
[env:idf-secure-s3]
extends = env:idf-s3
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure"

; ---------------------------------------------------------------------------
; env:idf-secureboot-s3 — idf-secure-s3 + Secure Boot v2 signed images.
; Unlike classic ESP32, S3 has no minimum-chip-revision gate for Secure Boot
; v2 — see sdkconfig.defaults.secureboot.s3 (omits CONFIG_ESP32_REV_MIN_3,
; a classic-ESP32-only Kconfig symbol). Reuses the same dev signing key as
; env:idf-secureboot: a signing key isn't chip-specific, and this is a dev
; key only — production keys are a separate, per-run concern (see
; docs/phase3-production-hardening.md §2).
; Generate: scripts/generate-secure-boot-dev-key.sh
; ---------------------------------------------------------------------------
[env:idf-secureboot-s3]
extends = env:idf-s3
board_build.partitions = partitions-secureboot.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure;sdkconfig.defaults.secureboot.s3"

; ---------------------------------------------------------------------------
; env:idf-c3 / idf-secure-c3 / idf-secureboot-c3 — same Phase 2 treatment,
; ESP32-C3 (RISC-V). No Secure Boot chip-revision gate on this family, see
; sdkconfig.defaults.secureboot.c3.
; ---------------------------------------------------------------------------
[env:idf-c3]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions-secure.csv
; board_build.flash_size alone does not propagate into the compiled
; sdkconfig for Arduino-as-IDF-component builds -- see sdkconfig.defaults.4mb.
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb"
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DJKBMSR_ARDUINO_AS_IDF=1
  -DJKBMSR_TARGET_HARDWARE=\"esp32-c3-4mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-c3-devkitm-1\"
  -DJKBMSR_MAX_GPIO_PIN=21
  -DJKBMSR_PROVISIONING_BUTTON_PIN=9

[env:idf-secure-c3]
extends = env:idf-c3
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure"

[env:idf-secureboot-c3]
extends = env:idf-c3
board_build.partitions = partitions-secureboot.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.4mb;sdkconfig.defaults.secure;sdkconfig.defaults.secureboot.c3"

; ---------------------------------------------------------------------------
; env:idf-8mb / idf-secure-8mb / idf-secureboot-8mb — same Phase 2 treatment,
; the 8 MB classic-ESP32 board. Same silicon as env:idf (ECO3+ gate applies,
; reuses sdkconfig.defaults.secureboot unmodified) — the only difference is
; board_build.flash_size. Reuses the 4 MB-sized partitions-secure.csv /
; partitions-secureboot.csv layout as-is (dev/validation only; the extra
; 4 MB sits unpartitioned here — revisit sizing if this ever becomes a real
; production image instead of a P2-5 validation target).
; ---------------------------------------------------------------------------
[env:idf-8mb]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = partitions-secure.csv
; board_build.flash_size alone does not propagate into the compiled
; sdkconfig for Arduino-as-IDF-component builds -- see sdkconfig.defaults.8mb.
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.8mb"
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DJKBMSR_ARDUINO_AS_IDF=1
  -DJKBMSR_TARGET_HARDWARE=\"esp32-classic-8mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32dev\"
  -DJKBMSR_MAX_GPIO_PIN=39
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0

[env:idf-secure-8mb]
extends = env:idf-8mb
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.8mb;sdkconfig.defaults.secure"

[env:idf-secureboot-8mb]
extends = env:idf-8mb
board_build.partitions = partitions-secureboot.csv
board_build.secure_boot_signing_key = keys/secure_boot_signing_key.pem
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.8mb;sdkconfig.defaults.secure;sdkconfig.defaults.secureboot"

; ---------------------------------------------------------------------------
; Spike: ESP32-S3-N16R8 (16 MB flash, 8 MB Octal PSRAM) built against
; arduino-esp32 3.x / ESP-IDF 5.x, to test the "framework generation" fix for
; the boot loop this module reports on the IDF 4.4 builds.
;
; WHY A SEPARATE FILE, not a stanza in platformio.ini:
; Every env in platformio.ini is required by scripts/run-checks.sh to be in its
; BUILD_MATRIX, and that script builds all of them in one shared
; PLATFORMIO_CORE_DIR. This env pins a *different* pioarduino release than
; env:esp32-c6-4mb, and two pioarduino releases both install a package named
; `framework-arduinoespressif32` — so building this in the same core dir would
; clobber the C6 target's framework (the same same-name collision documented at
; length in platformio.ini's header and release.sh's platform-isolation block).
; Keeping it out of platformio.ini keeps run-checks.sh and release.sh untouched
; and makes it impossible for this spike to disturb an existing target.
;
; Registered in platformio.ini via `extra_configs`, so it IS a normal PlatformIO
; env (`pio run -e esp32-s3-16mb-idf5`) — it is just invisible to the two
; scripts that scan the main file.
;
; BUILD IT IN ITS OWN CORE DIR. This is not optional:
;   PLATFORMIO_CORE_DIR=$PWD/.platformio-core-idf5 \
;     "$PIO" run -e esp32-s3-16mb-idf5
; Without that, the pioarduino platform/framework install lands in whichever
; shared core dir the command would otherwise use and breaks that dir's other
; targets on the next build.
;
; The platform release and what it provides (read from the release's own
; platform.json, not inferred):
;   platform      pioarduino/platform-espressif32 54.03.20
;   arduino-esp32 3.2.0          (esp32-3.2.0.zip)
;   ESP-IDF       5.4.1          (framework-espidf v5.4.1; the arduino libs are
;                                 built from idf-release_v5.4, 2f7dcd86-v1)
;   toolchain     xtensa-esp-elf 14.2.0+20241119, esptool 4.8.9
; That is byte-for-byte the stack behind the known-working colleague build
; (arduino-esp32 3.2.0 / IDF v5.4.1); see docs/esp32-s3-idf5-spike.md.
; ---------------------------------------------------------------------------
[env:esp32-s3-16mb-idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; board_upload.flash_size (not just board_build.flash_size) is what sets the
; 16 MB image-header/partition-verify field on S3 — see the long note on
; env:esp32-s3-16mb in platformio.ini. Identical geometry to that env, and the
; same partition table (nvs 0x9000 / otadata 0xe000 / app0 0x10000), so the
; browser flasher's fixed offsets still apply.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; The N16R8's PSRAM is OCTAL; qio_opi selects the IDF S3 qio_opi variant
; (CONFIG_SPIRAM_MODE_OCT). Same reasoning as env:esp32-s3-16mb.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = partitions-16mb-ota.csv
board_build.embed_files =
  data/cert/x509_crt_bundle.bin
; NimBLE-Arduino 2.x is the branch that supports arduino-esp32 3.x — the 1.4.3
; the older-core targets pin does not. Matches env:esp32-c6-4mb (the only other
; env already on core 3.x). ArduinoJson 7.x is framework-agnostic.
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^2.5.1
; Same identity flags as env:esp32-s3-16mb, deliberately: this is the SAME
; product target built against a different framework, not a new hardware target.
; Keeping JKBMSR_TARGET_HARDWARE = "esp32-s3-16mb" means a device running this
; image still reports the string jkbmsr-api's gatewayHardwareTargets catalog
; already knows, so a successful boot can actually register/check in.
build_flags =
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DJKBMSR_TARGET_HARDWARE=\"esp32-s3-16mb\"
  -DJKBMSR_HARDWARE_PLATFORM=\"esp32\"
  -DJKBMSR_BOARD_PROFILE=\"esp32-s3-devkitc-1\"
  -DJKBMSR_MAX_GPIO_PIN=48
  -DJKBMSR_PROVISIONING_BUTTON_PIN=0

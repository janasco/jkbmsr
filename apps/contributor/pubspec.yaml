name: jkbmsr_contributor
description: "JK BMS Contributor - help improve JK-BMS support by contributing your device data."
publish_to: 'none'
# First public release. The family scheme is MAJOR.MINOR.PATCH+BUILD, where
# the "+BUILD" suffix is the Android versionCode (apps/ble is 4.17.27+47,
# apps/pro is 1.3.44+76). 1.0.0 marks the first feature-complete v1 build; the
# versionCode starts at 1 and must increase by one on every Play upload.
# The Android build reads both from here (android/app/build.gradle.kts uses
# flutter.versionName / flutter.versionCode), and lib/services/app_info.dart
# mirrors it by hand for the payload's `app.version`.
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # The shared, pure-Dart JK-BMS protocol/model/detection core. Contributor is
  # the first consumer (see jkbmsr-private/ops/internal-notes/
  # contributor-app-plan.md §2); apps/ble and apps/pro keep their own copies
  # until their own migration is reviewed.
  bms_core:
    path: ../../packages/bms_core
  flutter_blue_plus: ^1.34.4
  # Persists the single first-run consent decision (a bool + a UTC timestamp).
  # apps/ble has no local key-value store (its persistent state is the sqflite
  # logbook), and Contributor has none at all yet, so a minimal key-value store
  # is the right size. `shared_preferences` is already the choice `apps/pro`
  # makes for the same kind of small local setting (`lib/app/theme_controller.dart`),
  # so the family stays consistent. See lib/services/consent_store.dart.
  shared_preferences: ^2.2.0
  # The anonymous contribution POST. `http` is the family's client (apps/ble and
  # apps/pro both use it), and its `testing.dart` MockClient is what lets the
  # uploader's real status handling be driven in a test. See
  # lib/services/contribution_uploader.dart.
  http: ^1.2.2
  # The mandatory offline fallback (plan §3.5): write the payload to the app
  # documents directory and hand it to the OS share sheet. Both are already used
  # by apps/pro for its CSV export (lib/features/history/telemetry_history_screen.dart).
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  # Google Play In-App Updates: Contributor ships only through Play, so this is
  # its whole update mechanism (there is no self-hosted APK channel). The
  # Play-vs-non-Play branch is in lib/services/app_update_service.dart. Same
  # version as apps/pro and apps/ble.
  in_app_update: ^5.0.0
  # Reads the installer package (com.android.vending) that created this
  # install, which decides whether Play's in-app update flow applies at all.
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Test-only: flutter_blue_plus throws UnsupportedError on the Dart VM, so
  # widget tests that mount the app install a no-op FlutterBluePlusPlatform.
  # Already a transitive dependency of flutter_blue_plus; pinned here so a test
  # can import it directly. (Same arrangement as apps/ble.)
  flutter_blue_plus_platform_interface: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icon/

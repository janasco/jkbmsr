name: jkbmsr_ble
description: "JK BMS Bluetooth - Bluetooth telemetry and control for JK-BMS."
publish_to: 'none'
version: 4.17.33+53

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  fl_chart: ^1.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.3.0
  # Google Play In-App Updates: the required update path for Play-installed
  # copies (Play policy forbids pointing a Play user at a sideloaded APK). The
  # direct-APK prompt in SoftwareUpdateModal/SelfUpdate is retained for
  # sideloaded copies only; the branch on installer package is in
  # lib/services/app_update_service.dart. Same version as apps/pro.
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  google_mobile_ads: ^9.1.0
  universal_ble: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: lets widget tests install a no-op UniversalBlePlatform so the
  # full app can be mounted on the Dart VM. Already a transitive dependency of
  # universal_ble; pinned here so the test can import it directly.
  # Test-only, same reason: in_app_purchase re-exports only the billing *types*,
  # not the platform interface, so a test double for the Supporter entitlement
  # has to swap InAppPurchasePlatform.instance. Already a transitive dependency
  # of in_app_purchase (resolved to the same 1.4.0); pinned here so the test can
  # import it directly. dev_dependencies never reach the shipped APK.
  in_app_purchase_platform_interface: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/branding/
  # Bundled, not fetched. These faces used to arrive through `google_fonts` at
  # runtime, so a fresh install rendered the platform fallback face until the
  # network answered — the same defect the Pro app fixed by bundling IBM Plex.
  # Static instances generated from the variable font with fontTools; OFL, see
  # assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

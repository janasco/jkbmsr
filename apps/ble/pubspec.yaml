name: jkbmsr_ble
description: "JK BMS Bluetooth - Bluetooth telemetry and control for JK-BMS."
publish_to: 'none'
version: 4.17.30+50

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_blue_plus: ^1.34.4   # 2.x requires a commercial licence; this is the MIT line
  fl_chart: ^1.3.1
  google_fonts: ^8.0.0
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.3.0
  # Google Play In-App Updates: the required update path for Play-installed
  # copies (Play policy forbids pointing a Play user at a sideloaded APK). The
  # direct-APK prompt in SoftwareUpdateModal/SelfUpdate is retained for
  # sideloaded copies only; the branch on installer package is in
  # lib/services/app_update_service.dart. Same version as apps/pro.
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  google_mobile_ads: ^9.1.0
  flutter_blue_plus_platform_interface: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: lets widget tests install a no-op FlutterBluePlusPlatform so the
  # full app can be mounted on the Dart VM (flutter_blue_plus itself throws
  # UnsupportedError there). Already a transitive dependency of
  # flutter_blue_plus; pinned here so the test can import it directly.
  # Test-only, same reason: in_app_purchase re-exports only the billing *types*,
  # not the platform interface, so a test double for the Supporter entitlement
  # has to swap InAppPurchasePlatform.instance. Already a transitive dependency
  # of in_app_purchase (resolved to the same 1.4.0); pinned here so the test can
  # import it directly. dev_dependencies never reach the shipped APK.
  in_app_purchase_platform_interface: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/branding/

name: Mobile app bug
description: Report a bug in the JKBMSR Android or iOS app
title: "[Mobile] "
labels: ["mobile-app", "bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: e.g. 1.3.0 (check the app's about/settings screen)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device model / OS version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: false
